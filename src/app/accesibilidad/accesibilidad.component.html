<!-- Modal de accesibilidad mejorado -->
<div class="accesibilidad-modal">
  <button 
    class="btn-toggle" 
    aria-label="Menú de accesibilidad"
    (click)="toggleMenu()">
    <i class="fas fa-universal-access"></i>
  </button>

  <div 
    class="accesibilidad-content"
    [class.show]="config.abierto">
    
    <!-- Sección de tamaño de fuente -->
    <div class="accessibility-font-label">Tamaño de texto</div>
    <div class="accessibility-font-controls">
      <button 
        class="accessibility-font-btn" 
        aria-label="Disminuir tamaño de fuente"
        (click)="disminuirFuente()">
        A-
      </button>
      <button 
        class="accessibility-font-btn reset" 
        aria-label="Tamaño de fuente normal"
        (click)="resetFuente()">
        A
      </button>
      <button 
        class="accessibility-font-btn" 
        aria-label="Aumentar tamaño de fuente"
        (click)="aumentarFuente()">
        A+
      </button>
    </div>

    <!-- Botones existentes -->
    <button 
      class="btn-acceso" 
      aria-label="Línea de lectura"
      (click)="toggleLineaLectura()">
      <i class="fas fa-grip-lines"></i> Línea de lectura
    </button>

    <button 
      class="btn-acceso" 
      aria-label="Escala de grises"
      (click)="toggleEscalaGrises()">
      <i class="fas fa-image"></i> Escala de grises
    </button>

    <button 
      class="btn-acceso" 
      aria-label="Invertir colores"
      (click)="toggleInvertirColores()">
      <i class="fas fa-adjust"></i> Invertir colores
    </button>

    <button 
      class="btn-acceso" 
      aria-label="Lectura en voz alta"
      (click)="toggleVoz()">
      <i class="fas fa-volume-up"></i> 
      {{ config.vozActiva ? 'Desactivar voz' : 'Lectura en voz' }}
    </button>
  </div>
</div>

<!-- Línea de lectura -->
<div 
  id="lineaLectura" 
  [style.display]="config.lineaActiva ? 'block' : 'none'"
  [style.top.px]="lineaY">
</div>
